name: Deploy Simulador

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  REGION: 'us-central1'
  TERRAFORM_VERSION: '1.6.0'
  BACKEND_URL: 'https://automind-backend.rodrigohub.com'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.image.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'yarn'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Type check
        run: yarn typecheck

      - name: Get project ID from terraform.tfvars
        id: project_id
        run: |
          PROJECT_ID=$(grep '^project_id' terraform/production/terraform.tfvars | cut -d'"' -f2)
          echo "PROJECT_ID=$PROJECT_ID" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Set image tag
        id: image
        run: |
          IMAGE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/simulador/simulador:${{ github.sha }}"
          echo "tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.tag }}
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/simulador/simulador:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  terraform:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: ./terraform
        env:
          TF_VAR_c6auto_cpf: ${{ secrets.C6AUTO_CPF }}
          TF_VAR_c6auto_senha: ${{ secrets.C6AUTO_SENHA }}
          TF_VAR_service_basic_auth: ${{ secrets.SERVICE_BASIC_AUTH }}
          TF_VAR_backend_basic_auth: ${{ secrets.BACKEND_BASIC_AUTH }}
          TF_VAR_backend_url: ${{ env.BACKEND_URL }}
          TF_VAR_docker_image: ${{ needs.build.outputs.image_tag }}
        run: terraform plan -var-file=production/terraform.tfvars

      - name: Terraform Apply
        working-directory: ./terraform
        env:
          TF_VAR_c6auto_cpf: ${{ secrets.C6AUTO_CPF }}
          TF_VAR_c6auto_senha: ${{ secrets.C6AUTO_SENHA }}
          TF_VAR_service_basic_auth: ${{ secrets.SERVICE_BASIC_AUTH }}
          TF_VAR_backend_basic_auth: ${{ secrets.BACKEND_BASIC_AUTH }}
          TF_VAR_backend_url: ${{ env.BACKEND_URL }}
          TF_VAR_docker_image: ${{ needs.build.outputs.image_tag }}
        run: terraform apply -auto-approve -var-file=production/terraform.tfvars

      - name: Output Service URL
        working-directory: ./terraform
        run: terraform output -raw service_url || echo "Service URL not available yet"
